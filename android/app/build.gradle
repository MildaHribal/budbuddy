apply plugin: 'com.android.application'

static int localVersionCode() {
    def now = Calendar.getInstance()
    def yy = now.get(Calendar.YEAR) % 100
    def day = now.get(Calendar.DAY_OF_YEAR)
    def slot = now.get(Calendar.HOUR_OF_DAY) * 4 + now.get(Calendar.MINUTE).intdiv(15)
    return (yy * 1000 + day) * 100 + slot
}

android {
    namespace "eu.budbuddy.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "eu.budbuddy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes -PversionCode (yyDDDnn, nn = run number). Local builds use the same
        // yyDDD prefix with nn = quarter-hour of the day, so they never fall back to 1.
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : localVersionCode()
        versionName project.hasProperty('versionName') ? project.property('versionName') : new groovy.json.JsonSlurper().parse(file('../../package.json')).version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // -PnoAi drops the offline AI pack (public/ai, 180+ MB) and the onnxruntime wasm Vite
            // copies into _nuxt (unused: the pack ships its own under ai/ort/), keeping the Play bundle small
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' + (project.hasProperty('noAi') ? ':<dir>ai:<file>ort-wasm-*' : '')
        }
    }
    androidResources {
        // On-device AI files in public/ai/ (100+ MB) are stored uncompressed so the
        // WebView can stream them straight from the APK instead of inflating them.
        noCompress 'onnx', 'ort', 'bin', 'wasm', 'npy', 'gguf', 'safetensors'
    }
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
