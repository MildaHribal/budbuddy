name: Deploy to Cloudflare

on:
  push:
    branches:
      - lazy-version
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build
        env:
          NUXT_PUBLIC_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
        run: npm run generate
      - run: sh deploy/cloudflare/stage.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a77f82ef009ae83b18d338ffa77e3699
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN secret is not set, skipping"; exit 0; fi
          npx --yes wrangler@4.150.0 deploy --config deploy/cloudflare/wrangler.jsonc
