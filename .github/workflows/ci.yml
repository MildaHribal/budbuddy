name: CI & Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-android:
    needs: check
    runs-on: ubuntu-latest
    # Skip with "[sb]" in the commit message; only build releases from the main branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/lazy-version' && !contains(github.event.head_commit.message, '[sb]')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: package_version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run generate
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Compute version code
        run: |
          # YY + day of year + run number (max 99 per day)
          echo "VERSION_CODE=$(date +%y)$(date +%j)$(printf "%02d" $((${{ github.run_number }} % 100)))" >> $GITHUB_ENV

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "KEYSTORE_PATH=release.jks" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret not set – the release APK will be unsigned."
          fi

      # -PnoAi: the offline AI pack is never part of the store build (see store/AI_PACK.md)
      - name: Build APKs and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ steps.package_version.outputs.VERSION }} \
            -PnoAi \
            --no-daemon --build-cache

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      # Upload-key signed bundle for Google Play (Play App Signing re-signs it)
      - name: Check the Play bundle
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          SIZE=$(stat -c %s "$AAB")
          echo "AAB size: $((SIZE / 1024 / 1024)) MB, versionCode ${{ env.VERSION_CODE }}" >> $GITHUB_STEP_SUMMARY
          if unzip -l "$AAB" | grep -q 'assets/public/ai/'; then echo "::error::AI pack leaked into the AAB"; exit 1; fi
          if [ -z "$KEYSTORE_PATH" ]; then echo "::warning::AAB is unsigned – Play Console will reject it."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ steps.package_version.outputs.VERSION }}-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Never publish a debug or unsigned build as a public release
      - name: Name the installable APK
        id: release_apk
        run: |
          if [ -z "$KEYSTORE_PATH" ]; then
            echo "::warning::No signing key – skipping the GitHub release."
            exit 0
          fi
          mkdir -p dist-release
          cp android/app/build/outputs/apk/release/app-release.apk "dist-release/BudBuddy-v${{ steps.package_version.outputs.VERSION }}.apk"
          echo "ready=true" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        if: steps.release_apk.outputs.ready == 'true'
        with:
          files: dist-release/*.apk
          tag_name: build-v${{ steps.package_version.outputs.VERSION }}-${{ github.run_number }}
          body: |
            📱 **BudBuddy ${{ steps.package_version.outputs.VERSION }}**

            Download the `.apk` below and open it on your Android phone to install.
            Commit: ${{ github.sha }}
