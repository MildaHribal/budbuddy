name: CI & Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-android:
    needs: check
    runs-on: ubuntu-latest
    # Skip with "[sb]" in the commit message; only build releases from the main branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/lazy-version' && !contains(github.event.head_commit.message, '[sb]')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: package_version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run generate
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Compute version code
        run: |
          # YY + day of year + run number (max 99 per day)
          echo "VERSION_CODE=$(date +%y)$(date +%j)$(printf "%02d" $((${{ github.run_number }} % 100)))" >> $GITHUB_ENV

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "KEYSTORE_PATH=release.jks" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret not set – the release APK will be unsigned."
          fi

      - name: Build APKs and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ steps.package_version.outputs.VERSION }} \
            --no-daemon --build-cache

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          tag_name: build-v${{ steps.package_version.outputs.VERSION }}-${{ github.run_number }}
          body: |
            Automated Android build for version **${{ steps.package_version.outputs.VERSION }}**
            Commit: ${{ github.sha }}
