name: Build and push docker image

on: [workflow_dispatch, push]

concurrency:
  group: build-and-push-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 24

jobs:
  build-android:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[sb]')"
    permissions:
      contents: write

    steps:
      # ------------------------------
      # Checkout & Setup
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: package_version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # ------------------------------
      # Dependencies & Build
      # ------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run generate

      # --------------------------------
      # Capacitor setup & caching
      # --------------------------------
      - name: Cache Capacitor assets
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/public
            android/app/src/main/res
          key: ${{ runner.os }}-capacitor-${{ hashFiles('.output/**') }}

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # --------------------------------
      # Android build setup
      # --------------------------------
      - name: Update Android version info
        run: |
          # Use YY + day of year + run number (max 99 per day)
          YEAR=$(date +%y)
          DAY_OF_YEAR=$(date +%j)
          RUN_NUMBER=$(printf "%02d" $((${{ github.run_number }} % 100)))
          VERSION_CODE="${YEAR}${DAY_OF_YEAR}${RUN_NUMBER}"
          echo "Generated VERSION_CODE: $VERSION_CODE (YYDDDNN format)"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=${{ steps.package_version.outputs.VERSION }}" >> $GITHUB_ENV

      # FIX: Add permission for gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --no-daemon --parallel --build-cache

      - name: Build Signed Release APK and AAB
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --no-daemon --parallel --build-cache

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          tag_name: build-v${{ steps.package_version.outputs.VERSION }}-${{ github.sha }}
          body: |
            Automated Android build for version **${{ steps.package_version.outputs.VERSION }}**
            Commit: ${{ github.sha }}
